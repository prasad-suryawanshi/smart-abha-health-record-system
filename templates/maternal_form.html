{% extends "base.html" %}
{% block title %}New Maternal Record · Smart ABHA{% endblock %}
{% block content %}
<div class="page-header"><div><h1>New Maternal Record</h1><p class="sub">Register a new mother</p></div>
<a href="{{ url_for('maternal_list') }}" class="btn btn-outline btn-sm">Back</a></div>
<div class="card" style="max-width:560px">
<div class="card-body">
<form method="POST">
    <div class="form-group"><label>ABHA ID *</label><input name="abha_id" class="form-control" required placeholder="ABHA-2024-001"></div>
    <div class="form-group"><label>Mother Name *</label><input name="mother_name" class="form-control" required></div>
    <div class="form-group"><label>Age</label><input type="number" name="age" class="form-control" min="12" max="55"></div>
    <div class="form-group"><label>Phone</label><input name="phone" class="form-control"></div>
    <div class="form-group"><label>Address</label><input name="address" class="form-control"></div>
    <div class="form-group"><label>Pregnancy Status</label>
        <select name="pregnancy_status" class="form-control">
            <option>Active</option><option>Completed</option><option>High Risk</option>
        </select></div>
    <div class="form-group"><label>Weeks of Pregnancy</label><input type="number" name="weeks_of_pregnancy" class="form-control" min="0" max="45"></div>
    <div class="form-group"><label>Blood Group</label><input name="blood_group" class="form-control" placeholder="O+"></div>
    <div class="form-group"><label>Medical Conditions</label><textarea name="medical_conditions" class="form-control" rows="2"></textarea></div>
    <button type="submit" class="btn btn-primary">Save Record</button>
</form>
</div></div>
{% endblock %}
