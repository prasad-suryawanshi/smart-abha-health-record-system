{% extends "base.html" %}
{% block title %}Login · Smart ABHA{% endblock %}
{% block extra_css %}
<style>
.auth-wrap{max-width:400px;margin:1.75rem auto 0}
.auth-card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-md);padding:1.85rem}
.auth-header{text-align:center;margin-bottom:1.5rem}
.auth-header h1{font-size:1.4rem;font-weight:700;margin-bottom:.25rem}
.auth-header p{color:var(--muted);font-size:.875rem}
.auth-card .btn{width:100%;padding:.65rem;margin-top:.35rem}
.switch{text-align:center;margin-top:1.2rem;font-size:.875rem;color:var(--muted)}
.switch a{color:var(--primary-dark);font-weight:600}
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Welcome back</h1>
      <p>Sign in to Smart ABHA</p>
    </div>
    <form method="POST">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <div class="switch">Don't have an account? <a href="{{ url_for('register') }}">Create an account</a></div>
  </div>
</div>
{% endblock %}
