{% extends "base.html" %}
{% block title %}Register · Smart ABHA{% endblock %}
{% block extra_css %}
<style>
.auth-wrap{max-width:440px;margin:1.75rem auto 0}
.auth-card{background:#fff;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-md);padding:1.85rem}
.auth-header{text-align:center;margin-bottom:1.5rem}
.auth-header h1{font-size:1.4rem;font-weight:700;margin-bottom:.25rem}
.auth-header p{color:var(--muted);font-size:.875rem}
.auth-card .btn{width:100%;padding:.65rem;margin-top:.35rem}
.switch{text-align:center;margin-top:1.2rem;font-size:.875rem;color:var(--muted)}
.switch a{color:var(--primary-dark);font-weight:600}
.hint{font-size:.72rem;color:var(--muted);margin-top:.25rem}
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Create your account</h1>
      <p>Join Smart ABHA Health Record System</p>
    </div>
    <form method="POST">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" class="form-control" value="{{ form.name if form else '' }}" required minlength="2" autocomplete="name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" class="form-control" value="{{ form.email if form else '' }}" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" name="role" class="form-control" required>
          <option value="mother">Mother / Parent</option>
          <option value="asha">ASHA Worker</option>
          <option value="anganwadi">Anganwadi Worker</option>
          <option value="doctor">Doctor</option>
          <option value="admin">Administrator</option>
        </select>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required minlength="6" autocomplete="new-password">
        <p class="hint">Minimum 6 characters</p>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" class="form-control" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary">Create Account</button>
    </form>
    <div class="switch">Already have an account? <a href="{{ url_for('login') }}">Login</a></div>
  </div>
</div>
{% endblock %}
