{% extends "base.html" %}
{% block title %}Contact · Smart ABHA{% endblock %}
{% block content %}
<div class="page-header">
  <div><h1>Contact</h1><p class="sub">We are here to help</p></div>
</div>
<div style="display:grid;grid-template-columns:1fr 1.2fr;gap:1.5rem">
  <div class="card">
    <div class="card-header">Get in touch</div>
    <div class="card-body" style="font-size:.92rem;color:var(--muted);line-height:1.85">
      <p><strong style="color:var(--text)">Email</strong><br>support@smartabha.com</p>
      <p style="margin-top:1rem"><strong style="color:var(--text)">Hours</strong><br>Monday – Saturday<br>9:00 AM – 6:00 PM</p>
    </div>
  </div>
  <div class="card">
    <div class="card-header">Send a message</div>
    <div class="card-body">
      <form method="POST">
        <div class="form-group"><label>Name</label><input name="name" class="form-control" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" class="form-control" required></div>
        <div class="form-group"><label>Subject</label><input name="subject" class="form-control"></div>
        <div class="form-group"><label>Message</label><textarea name="message" class="form-control" rows="4" required></textarea></div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </div>
  </div>
</div>
<style>@media(max-width:700px){.main>div[style*="grid"]{grid-template-columns:1fr!important}}</style>
{% endblock %}
