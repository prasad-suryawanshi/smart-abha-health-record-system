{% extends "base.html" %}
{% block title %}New Child Record · Smart ABHA{% endblock %}
{% block content %}
<div class="page-header"><div><h1>New Child Record</h1><p class="sub">Register a new child</p></div>
<a href="{{ url_for('child_list') }}" class="btn btn-outline btn-sm">Back</a></div>
<div class="card" style="max-width:560px">
<div class="card-body">
<form method="POST">
    <div class="form-group"><label>ABHA ID *</label><input name="abha_id" class="form-control" required placeholder="ABHA-C-2024-001"></div>
    <div class="form-group"><label>Child Name *</label><input name="child_name" class="form-control" required></div>
    <div class="form-group"><label>Gender</label>
        <select name="gender" class="form-control"><option>Male</option><option>Female</option><option>Other</option></select></div>
    <div class="form-group"><label>Date of Birth *</label><input type="date" name="date_of_birth" class="form-control" required></div>
    <button type="submit" class="btn btn-primary">Save Record</button>
</form>
</div></div>
{% endblock %}
